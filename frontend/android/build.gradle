// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // 原生壳（Compose）需要 Kotlin 与 Compose 编译器插件。
        // 注意：buildscript{} 先于下面的 apply from: "variables.gradle" 求值，
        // 这里不能用 $kotlinVersion（会取不到值），改版本时同步 variables.gradle。
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.21'
        classpath 'org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:2.4.21'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
